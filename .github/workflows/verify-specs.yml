name: Public Podspec validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install cocoapods -v 1.17.0 --no-document
      - name: Download public archives and compile both Pods
        run: pod spec lint Specs/*/*/*.podspec --allow-warnings
