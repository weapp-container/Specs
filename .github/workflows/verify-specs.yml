name: Public Podspec validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install cocoapods -v 1.17.0 --no-document
      - name: Download public archives and compile both Pods
        run: pod spec lint Specs/*/*/*.podspec --allow-warnings
      - name: Resolve public Specs and build independent iOS and macOS consumers
        run: ruby tools/consume-public.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pods-consumer
          path: artifacts/
          if-no-files-found: warn
